<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enquiry Form</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:40px;
}

.form-container{
max-width:700px;
margin:auto;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
margin-bottom:25px;
color:#0A3D62;
text-align:center;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
color:black;
margin-bottom:8px;
font-weight:600;
}

input,
select,
textarea{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}

textarea{
resize:vertical;
height:120px;
}

button{

width:100%;
padding:15px;
background:#0A3D62;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;

}

button:hover{
background:#1464a0;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.close-btn{
    position:fixed;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#0A3D62;
    color:#fff;
    font-size:24px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s ease;
    z-index:999;
}

.close-btn:hover{
    background:#e53935;
    transform:rotate(90deg);
}

</style>

</head>

<body>
    <button class="close-btn" onclick="closeForm()">&times;</button>

<div class="form-container">

<h2>Rental Enquiry</h2>

<form id="contactForm">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Company Name</label>
<input type="text" name="company">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="tel" name="phone" required>
</div>

<div class="form-group">
<label>Service</label>

<select name="service" required>

<option value="">Select</option>

<option>Server Rental</option>

<option>Laptop Rental</option>

<option>Computer Rental</option>

<option>Firewall Rental</option>

<option>Printer Rental</option>

<option>Refurbished Computer</option>

<option>Refurbished Laptop</option>

<option>Refurbished Server</option>

</select>

</div>

<div class="form-group">

<label>Quantity</label>

<input type="number" name="quantity">

</div>

<div class="form-group">

<label>Message</label>

<textarea name="message"></textarea>

</div>

<button type="submit">Submit Enquiry</button>

<div id="status"></div>

</form>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbzQfms6CAseFL3oCfrk_7vZ0Vadh3-azUgzx87FqUgS-drj8_2_LFo85rXRyAxt9QaM/exec";

const form = document.getElementById("contactForm");
const status = document.getElementById("status");
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    status.innerHTML = "";

    const data = {
        name: form.name.value,
        company: form.company.value,
        email: form.email.value,
        phone: form.phone.value,
        service: form.service.value,
        quantity: form.quantity.value,
        message: form.message.value
    };

    try {

        const response = await fetch(scriptURL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data),
        });


        const result = await response.text();
        console.log(result);

        status.innerHTML = "✅ Enquiry Submitted Successfully";
        form.reset();

    } catch (err) {
        if (err.name === "AbortError") {
            status.innerHTML = "❌ Request timed out. Please try again.";
        } else {
            status.innerHTML = "❌ " + err.message;
        }
        console.error(err);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Enquiry";
    }
});

function closeForm(){

    if(document.referrer){
        window.history.back();
    }else{
        window.location.href = "index.html";
    }

}
</script>

</body>
</html>
