<style>

*{
margin:0;

body{
background:#f5f7fb;
padding:40px;
}

.form-container{
max-width:700px;
margin:auto;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
margin-bottom:25px;
color:#0A3D62;

}

margin-bottom:18px;
}

label{
display:block;
color:black;

input,
select,
textarea{

width:100%;
padding:14px;
border:1px solid #ddd;

<body>
    <button class="close-btn" onclick="closeForm()">&times;</button>

<div class="form-container">

<h2>Rental Enquiry</h2>

<form id="contactForm">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Company Name</label>
<input type="text" name="company">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="tel" name="phone" required>
</div>

<div class="form-group">
<label>Service</label>

<select name="service" required>

<option value="">Select</option>

<option>Server Rental</option>

<option>Laptop Rental</option>

<option>Computer Rental</option>

<option>Firewall Rental</option>

<option>Printer Rental</option>

<option>Refurbished Computer</option>

<option>Refurbished Laptop</option>

<option>Refurbished Server</option>

</select>

</div>

<div class="form-group">

<label>Quantity</label>

<input type="number" name="quantity">

</div>

<div class="form-group">

<label>Message</label>

<textarea name="message"></textarea>

</div>

<button type="submit">Submit Enquiry</button>

<div id="status"></div>

</form>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbzQfms6CAseFL3oCfrk_7vZ0Vadh3-azUgzx87FqUgS-drj8_2_LFo85rXRyAxt9QaM/exec";

const form = document.getElementById("contactForm");
const status = document.getElementById("status");
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    status.textContent = "";

    const data = {
        name: form.elements["name"].value,
        company: form.elements["company"].value,
        email: form.elements["email"].value,
        phone: form.elements["phone"].value,
        service: form.elements["service"].value,
        quantity: form.elements["quantity"].value,
        message: form.elements["message"].value
    };

    try {
        const response = await fetch(scriptURL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        const result = await response.text();

        console.log("Server response:", result);

        if (result.trim() === "Success") {
            status.innerHTML = "✅ Enquiry Submitted Successfully";
            form.reset();
        } else {
            status.innerHTML = "❌ " + result;
        }

    } catch (error) {
        console.error(error);
        status.innerHTML = "❌ Failed to submit enquiry: " + error.message;
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Enquiry";
    }
});

function closeForm(){

    if(document.referrer){
        window.history.back();
    }else{
        window.location.href = "index.html";
    }

}
</script>

</body>
